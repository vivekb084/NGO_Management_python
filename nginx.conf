events { worker_connections 1024; }

http {
    upstream fastapi_cluster {
        # 'ngo_management' matches the service name in docker-compose.yml
        # Docker Compose automatically load-balances across all scaled replicas of this service
        server ngo_management:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}